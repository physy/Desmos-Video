<!-- save as favicon-main.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Site icon">
  <rect width="64" height="64" rx="12" fill="#328eea"/>
  <!-- film slits -->
  <g fill="#ffffff" opacity="0.12">
    <rect x="8" y="8" width="6" height="6" rx="1"/>
    <rect x="8" y="24" width="6" height="6" rx="1"/>
    <rect x="8" y="40" width="6" height="6" rx="1"/>
  </g>
  <!-- play triangle -->
  <polygon points="26,20 46,32 26,44" fill="#fff"/>
  <!-- subtle outline -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#000000" stroke-opacity="0.06"/>
</svg>
